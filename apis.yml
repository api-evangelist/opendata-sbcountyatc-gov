apis:
  - aid: opendata-sbcountyatc-gov:catalog
    name: San Bernardino County ATC OpenData CKAN Action API
    description: >-
      CKAN Action API for San Bernardino County ATC OpenData, a consistent JSON-over-HTTP interface over a catalog of 8 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://opendata.sbcountyatc.gov/api/3/action/.
